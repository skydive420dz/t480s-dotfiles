set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events off

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1d21,fg=#f0efeb"
set -g status-justify centre
set -g window-status-separator ""
set -g window-status-format "#[fg=#676d77] #I "
set -g window-status-current-format "#[fg=#1a1d21,bg=#b4c0c8,bold] #I #[default]"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[bg=#22262b] #S #[default] #{b:pane_current_path} "
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[default] ,}#{user}@#H %H:%M "
set -g message-style "fg=#f0efeb,bg=#282c34"
set -g mode-style "fg=#1a1d21,bg=#b4c0c8,bold"
set -g pane-border-style "fg=#3d424a"
set -g pane-active-border-style "fg=#b4c0c8"

unbind -q %
unbind -q '"'
unbind -q c
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -v -c "#{pane_current_path}"
bind Enter new-window -c "#{pane_current_path}"
bind s choose-tree -s

bind-key -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?(emacs(client)?|\.emacsclient-wr)$'" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?(emacs(client)?|\.emacsclient-wr)$'" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?(emacs(client)?|\.emacsclient-wr)$'" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?(emacs(client)?|\.emacsclient-wr)$'" "send-keys C-l" "select-pane -R"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind-key -q [
unbind-key -q ]
bind v copy-mode
bind p run-shell "xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer -p -t '#{pane_id}'"
bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi Enter send-keys -X cancel

set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
bind r source-file ~/.config/tmux/t480s.conf \; display "Reloaded!"
